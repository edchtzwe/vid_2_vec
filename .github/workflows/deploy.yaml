name: Manual Infrastructure & App Deployment

# Manual only. Required repository configuration (see infra/README.md "Drop-in values"):
#   Variables: AWS_REGION, GCP_REGION, GCP_PROJECT_ID
#   Secrets:   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, GCP_SA_KEY
# The cluster name is read from Terraform outputs.

on:
  workflow_dispatch:
    inputs:
      cloud_provider:
        description: "Target Cloud Provider"
        required: true
        type: choice
        options:
          - aws
          - gcp
        default: "aws"
      action:
        description: "Terraform Action"
        required: true
        type: choice
        options:
          - apply
          - plan
          - destroy
        default: "plan"

concurrency:
  group: deploy-${{ github.event.inputs.cloud_provider }}
  cancel-in-progress: false

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Phase 1: Terraform L1 Foundation (VPC, Cluster, OIDC, Container Registry)
  # ───────────────────────────────────────────────────────────────────────────
  terraform-foundation:
    name: Phase 1 - Terraform L1 Provisioning
    runs-on: ubuntu-latest
    outputs:
      registry_url: ${{ steps.outputs.outputs.registry_url }}
      cluster_name: ${{ steps.outputs.outputs.cluster_name }}
      subnet_a: ${{ steps.outputs.outputs.subnet_a }}
      subnet_b: ${{ steps.outputs.outputs.subnet_b }}
      network_name: ${{ steps.outputs.outputs.network_name }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Required Configuration
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          missing=""
          if [ "${{ github.event.inputs.cloud_provider }}" = "aws" ]; then
            [ -z "$AWS_ACCESS_KEY_ID" ] && missing="$missing AWS_ACCESS_KEY_ID(secret)"
            [ -z "$AWS_SECRET_ACCESS_KEY" ] && missing="$missing AWS_SECRET_ACCESS_KEY(secret)"
            [ -z "$AWS_REGION" ] && missing="$missing AWS_REGION(variable)"
          else
            [ -z "$GCP_SA_KEY" ] && missing="$missing GCP_SA_KEY(secret)"
            [ -z "$GCP_PROJECT_ID" ] && missing="$missing GCP_PROJECT_ID(variable)"
          fi
          if [ -n "$missing" ]; then
            echo "::error::Missing required repository configuration:$missing"
            exit 1
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Configure AWS Credentials
        if: github.event.inputs.cloud_provider == 'aws'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Authenticate to Google Cloud
        if: github.event.inputs.cloud_provider == 'gcp'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Terraform Init & Run
        working-directory: infra/terraform/${{ github.event.inputs.cloud_provider }}
        run: |
          terraform init
          VAR_ARGS=""
          if [ "${{ github.event.inputs.cloud_provider }}" = "gcp" ]; then
            VAR_ARGS="-var=project_id=${{ vars.GCP_PROJECT_ID }}"
            if [ -n "${{ vars.GCP_REGION }}" ]; then
              VAR_ARGS="$VAR_ARGS -var=region=${{ vars.GCP_REGION }}"
            fi
          elif [ "${{ github.event.inputs.cloud_provider }}" = "aws" ]; then
            if [ -n "${{ vars.AWS_REGION }}" ]; then
              VAR_ARGS="-var=aws_region=${{ vars.AWS_REGION }}"
            fi
          fi
          if [ "${{ github.event.inputs.action }}" = "apply" ]; then
            terraform apply -auto-approve $VAR_ARGS
          elif [ "${{ github.event.inputs.action }}" = "destroy" ]; then
            terraform destroy -auto-approve $VAR_ARGS
          else
            terraform plan $VAR_ARGS
          fi

      - name: Capture Terraform Outputs
        id: outputs
        if: github.event.inputs.action == 'apply'
        working-directory: infra/terraform/${{ github.event.inputs.cloud_provider }}
        run: |
          echo "cluster_name=$(terraform output -raw cluster_name)" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event.inputs.cloud_provider }}" = "aws" ]; then
            echo "registry_url=$(terraform output -raw ecr_repository_url)" >> "$GITHUB_OUTPUT"
            echo "subnet_a=$(terraform output -json private_subnet_ids | jq -r '.[0]')" >> "$GITHUB_OUTPUT"
            echo "subnet_b=$(terraform output -json private_subnet_ids | jq -r '.[1]')" >> "$GITHUB_OUTPUT"
          else
            echo "registry_url=$(terraform output -raw artifact_registry_repository)" >> "$GITHUB_OUTPUT"
            echo "network_name=$(terraform output -raw network_name)" >> "$GITHUB_OUTPUT"
          fi

  # ───────────────────────────────────────────────────────────────────────────
  # Phase 2: Build & Push Container Image (prod image only)
  # ───────────────────────────────────────────────────────────────────────────
  build-push:
    name: Phase 2 - Build & Push Image
    needs: terraform-foundation
    if: github.event.inputs.action == 'apply'
    runs-on: ubuntu-latest
    outputs:
      image_ref: ${{ steps.image.outputs.image_ref }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        if: github.event.inputs.cloud_provider == 'aws'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Authenticate to Google Cloud
        if: github.event.inputs.cloud_provider == 'gcp'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        if: github.event.inputs.cloud_provider == 'gcp'
        uses: google-github-actions/setup-gcloud@v2

      - name: Build & Push
        id: image
        env:
          REGISTRY_URL: ${{ needs.terraform-foundation.outputs.registry_url }}
          GCP_REGION: ${{ vars.GCP_REGION }}
        run: |
          IMAGE_TAG="${GITHUB_SHA::12}"
          if [ "${{ github.event.inputs.cloud_provider }}" = "aws" ]; then
            REGISTRY_HOST="${REGISTRY_URL%%/*}"
            aws ecr get-login-password --region "${{ vars.AWS_REGION }}" \
              | docker login --username AWS --password-stdin "$REGISTRY_HOST"
          else
            gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
          fi
          IMAGE_REF="${REGISTRY_URL}:${IMAGE_TAG}"
          docker build -f Dockerfile.prod -t "$IMAGE_REF" .
          docker push "$IMAGE_REF"
          echo "image_ref=${IMAGE_REF}" >> "$GITHUB_OUTPUT"

  # ───────────────────────────────────────────────────────────────────────────
  # Phase 3: Cluster Deployment
  #   kubeconfig -> Crossplane (DB) -> wait DB -> platform (Redis, migration)
  #   -> wait migration -> app (workers, API) -> rollout
  # Each stage waits for the previous dependency to be alive before proceeding.
  # ───────────────────────────────────────────────────────────────────────────
  cluster-deploy:
    name: Phase 3 - Cluster Deployment
    needs: [terraform-foundation, build-push]
    if: github.event.inputs.action == 'apply'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Phase 3.1 - Configure AWS Credentials
        if: github.event.inputs.cloud_provider == 'aws'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Phase 3.1 - Update kubeconfig (EKS)
        if: github.event.inputs.cloud_provider == 'aws'
        run: |
          aws eks update-kubeconfig \
            --name "${{ needs.terraform-foundation.outputs.cluster_name }}" \
            --region "${{ vars.AWS_REGION }}"

      - name: Phase 3.1 - Authenticate to Google Cloud
        if: github.event.inputs.cloud_provider == 'gcp'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Phase 3.1 - Setup gcloud
        if: github.event.inputs.cloud_provider == 'gcp'
        uses: google-github-actions/setup-gcloud@v2

      - name: Phase 3.1 - Update kubeconfig (GKE)
        if: github.event.inputs.cloud_provider == 'gcp'
        run: |
          gcloud container clusters get-credentials \
            "${{ needs.terraform-foundation.outputs.cluster_name }}" \
            --region "${{ vars.GCP_REGION }}" \
            --project "${{ vars.GCP_PROJECT_ID }}"

      - name: Phase 3.2 - Inject Configuration into Crossplane Manifests
        env:
          PROVIDER: ${{ github.event.inputs.cloud_provider }}
          CLUSTER_NAME: ${{ needs.terraform-foundation.outputs.cluster_name }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          S3_MEDIA_BUCKET: ${{ vars.S3_MEDIA_BUCKET }}
          SUBNET_A: ${{ needs.terraform-foundation.outputs.subnet_a }}
          SUBNET_B: ${{ needs.terraform-foundation.outputs.subnet_b }}
          NETWORK_NAME: ${{ needs.terraform-foundation.outputs.network_name }}
        run: |
          if [ "$PROVIDER" = "aws" ]; then
            ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
            OIDC_ISSUER=$(aws eks describe-cluster --name "$CLUSTER_NAME" --region "$AWS_REGION" --query cluster.identity.oidc.issuer --output text)
            OIDC_HOST="${OIDC_ISSUER#https://}"
            OIDC_ID="${OIDC_ISSUER##*/id/}"
            BUCKET="${S3_MEDIA_BUCKET:-vid2vec-media-${ACCOUNT_ID}}"

            find infra/crossplane/aws -type f -name "*.yaml" -exec sed -i \
              -e "s|<AWS_ACCOUNT_ID>|${ACCOUNT_ID}|g" \
              -e "s|oidc.eks.us-east-1.amazonaws.com/id/<EKS_OIDC_ID>|${OIDC_HOST}|g" \
              -e "s|<EKS_OIDC_ID>|${OIDC_ID}|g" \
              -e "s|<S3_MEDIA_BUCKET>|${BUCKET}|g" \
              -e "s|<PRIVATE_SUBNET_ID_AZ_A>|${SUBNET_A}|g" \
              -e "s|<PRIVATE_SUBNET_ID_AZ_B>|${SUBNET_B}|g" {} +
          else
            NET="${NETWORK_NAME:-vid2vec-gcp-vpc}"
            find infra/crossplane/gcp -type f -name "*.yaml" -exec sed -i \
              -e "s|<GCP_PROJECT_ID>|${GCP_PROJECT_ID}|g" \
              -e "s|<GCP_NETWORK_NAME>|${NET}|g" {} +
          fi

      - name: Phase 3.3 - Apply Crossplane Providers & Managed Resources
        run: |
          PROVIDER="${{ github.event.inputs.cloud_provider }}"
          kubectl apply -f "infra/crossplane/${PROVIDER}/provider-${PROVIDER}.yaml"
          kubectl apply -f "infra/crossplane/${PROVIDER}/iam.yaml"
          if [ "$PROVIDER" = "aws" ]; then
            kubectl apply -f infra/crossplane/aws/rds-postgres.yaml
          else
            kubectl apply -f infra/crossplane/gcp/cloudsql-postgres.yaml
          fi

      - name: Phase 3.4 - Wait for Crossplane Providers Healthy
        run: |
          if [ "${{ github.event.inputs.cloud_provider }}" = "aws" ]; then
            kubectl wait --for=condition=Healthy --timeout=600s provider.pkg.crossplane.io/provider-aws-rds
            kubectl wait --for=condition=Healthy --timeout=600s provider.pkg.crossplane.io/provider-aws-iam
          else
            kubectl wait --for=condition=Healthy --timeout=600s provider.pkg.crossplane.io/provider-gcp-sql
            kubectl wait --for=condition=Healthy --timeout=600s provider.pkg.crossplane.io/provider-gcp-cloudplatform
          fi

      - name: Phase 3.5 - Wait for Database Ready
        run: |
          if [ "${{ github.event.inputs.cloud_provider }}" = "aws" ]; then
            kubectl wait --for=condition=Ready --timeout=900s instance.rds.aws.upbound.io/vid2vec-postgres-db
          else
            kubectl wait --for=condition=Ready --timeout=900s databaseinstance.sql.gcp.upbound.io/vid2vec-cloudsql-postgres
          fi
          until kubectl get secret postgres-conn -o jsonpath='{.data.endpoint}' 2>/dev/null | grep -q .; do
            sleep 5
          done

      - name: Phase 3.6 - Generate Database Connection Secret
        run: |
          DB_USER=$(kubectl get secret postgres-conn -o jsonpath='{.data.username}' | base64 -d)
          DB_PASS=$(kubectl get secret postgres-conn -o jsonpath='{.data.password}' | base64 -d)
          DB_HOST=$(kubectl get secret postgres-conn -o jsonpath='{.data.endpoint}' | base64 -d)
          kubectl create secret generic vid2vec-db-credentials \
            --from-literal=DATABASE_URL="postgresql://${DB_USER}:${DB_PASS}@${DB_HOST}:5432/ion_discovery_proto?sslmode=require" \
            --dry-run=client -o yaml > infra/k8s/platform/db-credentials.yaml

      - name: Phase 3.7 - Setup Kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/kustomize

      - name: Phase 3.8 - Set Image Tag
        env:
          IMAGE_REF: ${{ needs.build-push.outputs.image_ref }}
        run: |
          (cd infra/k8s/platform && kustomize edit set image "vid2vec=${IMAGE_REF}")
          (cd infra/k8s/app && kustomize edit set image "vid2vec=${IMAGE_REF}")

      - name: Phase 3.9 - Deploy Platform & Wait for Migration
        run: |
          kubectl delete job vid2vec-db-migration --ignore-not-found
          kubectl apply -k infra/k8s/platform
          kubectl rollout status deployment/redis --timeout=300s
          kubectl wait --for=condition=complete job/vid2vec-db-migration --timeout=900s

      - name: Phase 3.10 - Deploy Application Workloads
        run: |
          kubectl apply -k infra/k8s/app
          kubectl rollout status deployment/worker-uploader --timeout=300s
          kubectl rollout status deployment/worker-state --timeout=300s
          kubectl rollout status deployment/worker-analyzer --timeout=300s
          kubectl rollout status deployment/worker-embedder --timeout=300s
          kubectl rollout status deployment/vid2vec-api --timeout=300s
