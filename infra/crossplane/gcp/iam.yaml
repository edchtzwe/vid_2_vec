apiVersion: cloudplatform.gcp.upbound.io/v1beta1
kind: ServiceAccount
metadata:
  name: vid2vec-worker-app-sa
spec:
  forProvider:
    displayName: "Workload Service Account for vid2vec workers"
  providerConfigRef:
    name: default
---
apiVersion: cloudplatform.gcp.upbound.io/v1beta1
kind: ProjectIAMMember
metadata:
  name: vid2vec-worker-storage-access
spec:
  forProvider:
    project: vid2vec-prod-project-id
    role: roles/storage.objectAdmin
    member: "serviceAccount:vid2vec-worker-app-sa@vid2vec-prod-project-id.iam.gserviceaccount.com"
  providerConfigRef:
    name: default
---
apiVersion: cloudplatform.gcp.upbound.io/v1beta1
kind: ServiceAccountIAMMember
metadata:
  name: vid2vec-worker-workload-identity
spec:
  forProvider:
    serviceAccountIdSelector:
      matchControllerRef: true
    role: roles/iam.workloadIdentityUser
    member: "serviceAccount:vid2vec-prod-project-id.svc.id.goog[default/vid2vec-worker-sa]"
  providerConfigRef:
    name: default

# ─────────────────────────────────────────────────────────────────────────────
# Machine Service Account: Admin (Full GCP Platform & IAM Administration)
# ─────────────────────────────────────────────────────────────────────────────
---
apiVersion: cloudplatform.gcp.upbound.io/v1beta1
kind: ServiceAccount
metadata:
  name: vid2vec-admin-sa
spec:
  forProvider:
    displayName: "Administrator Service Account"
  providerConfigRef:
    name: default
---
apiVersion: cloudplatform.gcp.upbound.io/v1beta1
kind: ProjectIAMMember
metadata:
  name: vid2vec-admin-owner-binding
spec:
  forProvider:
    project: vid2vec-prod-project-id
    role: roles/owner
    member: "serviceAccount:vid2vec-admin-sa@vid2vec-prod-project-id.iam.gserviceaccount.com"
  providerConfigRef:
    name: default

# ─────────────────────────────────────────────────────────────────────────────
# Machine Service Account: Worker (App Deployments, DB Client, Storage, Logs)
# ─────────────────────────────────────────────────────────────────────────────
