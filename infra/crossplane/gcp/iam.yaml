apiVersion: cloudplatform.gcp.upbound.io/v1beta1
kind: ServiceAccount
metadata:
  name: vid2vec-worker-sa
spec:
  forProvider:
    displayName: "Worker Service Account"
  providerConfigRef:
    name: default
---
apiVersion: cloudplatform.gcp.upbound.io/v1beta1
kind: ProjectIAMMember
metadata:
  name: vid2vec-worker-container-binding
spec:
  forProvider:
    project: vid2vec-prod-project-id
    role: roles/container.developer
    member: "serviceAccount:vid2vec-worker-sa@vid2vec-prod-project-id.iam.gserviceaccount.com"
  providerConfigRef:
    name: default
---
apiVersion: cloudplatform.gcp.upbound.io/v1beta1
kind: ProjectIAMMember
metadata:
  name: vid2vec-worker-cloudsql-binding
spec:
  forProvider:
    project: vid2vec-prod-project-id
    role: roles/cloudsql.client
    member: "serviceAccount:vid2vec-worker-sa@vid2vec-prod-project-id.iam.gserviceaccount.com"
  providerConfigRef:
    name: default
---
apiVersion: cloudplatform.gcp.upbound.io/v1beta1
kind: ProjectIAMMember
metadata:
  name: vid2vec-worker-storage-binding
spec:
  forProvider:
    project: vid2vec-prod-project-id
    role: roles/storage.objectAdmin
    member: "serviceAccount:vid2vec-worker-sa@vid2vec-prod-project-id.iam.gserviceaccount.com"
  providerConfigRef:
    name: default

