apiVersion: batch/v1
kind: Job
metadata:
  name: vid2vec-db-migration
spec:
  template:
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: vid2vec-db-credentials
                  key: DATABASE_URL
          command:
            - sh
            - -c
            - until pg_isready -d "$DATABASE_URL" >/dev/null 2>&1; do sleep 3; done
      containers:
        - name: db-migrate
          image: vid2vec:latest
          command: ["./bin/migrate"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: vid2vec-db-credentials
                  key: DATABASE_URL
            - name: DB_SCHEMA
              value: "discovery_showcase"
      restartPolicy: OnFailure
  backoffLimit: 3
