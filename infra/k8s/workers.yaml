apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-uploader
  labels:
    app: vid2vec-worker
    component: uploader
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vid2vec-worker
      component: uploader
  template:
    metadata:
      labels:
        app: vid2vec-worker
        component: uploader
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values: ["vid2vec-worker"]
                topologyKey: "kubernetes.io/hostname"
      containers:
        - name: worker-uploader
          image: vid2vec:latest
          command: ["./bin/worker-uploader"]
          env:
            - name: REDIS_URL
              value: "redis://redis-service:6379/0"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-conn
                  key: endpoint
                  optional: true
            - name: DB_SCHEMA
              value: "discovery_showcase"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
