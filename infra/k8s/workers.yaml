apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-uploader
  labels:
    app: vid2vec-worker
    component: uploader
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vid2vec-worker
      component: uploader
  template:
    metadata:
      labels:
        app: vid2vec-worker
        component: uploader
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: component
                    operator: In
                    values: ["uploader"]
              topologyKey: "kubernetes.io/hostname"
      containers:
        - name: worker-uploader
          image: vid2vec:latest
          command: ["./bin/worker-uploader"]
          env:
            - name: REDIS_URL
              value: "redis://redis-service:6379/0"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-conn
                  key: endpoint
                  optional: true
            - name: DB_SCHEMA
              value: "discovery_showcase"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            exec:
              command: ["kill", "-0", "1"]
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 10
          livenessProbe:
            exec:
              command: ["kill", "-0", "1"]
            periodSeconds: 15
            failureThreshold: 3
---
